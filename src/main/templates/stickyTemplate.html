<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body { background:transparent; font-family:system-ui; width:100%; height: 100%; display:flex; overflow:hidden; }
    
    .sticky-container { 
      background:transparent;
      border-radius:12px;
      backdrop-filter:blur(2px);
      width:100%;
      height: 100%;
      display:flex; 
      flex-direction:column; 
      transition: all 0.2s ease;
    }
    
    .content-area { display:flex; flex: 1; align-items:flex-start; padding:0px; gap:6px; margin-bottom:3px; }
    .avatar-area { position: relative; flex-shrink:0; text-align:center; }
    .avatar-area img { display:block; pointer-events: none;-webkit-user-drag: none;}
    .status-icon { display:none; position: absolute; bottom: 0px; left: 13px; background: transparent; border-radius: 50%; width: 20px; height: 20px; align-items: center; justify-content: center; font-size: 12px; box-shadow:0 1px 2px rgba(0,0,0,0.2); z-index: 1; }
    .task-text { flex:1; align-items:center; font-size:14px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word; outline:none; background:{{priorityColor}}; border-radius:8px; padding:4px 8px; min-height:45px;margin-right:3px; box-shadow: 0 2px 3px rgba(0,0,0,0.2); }
    .task-text:focus { background:rgba(255,255,200,0.8); }
    
    .toolbar {
      display: inline-flex;
      justify-content: flex-start;
      gap: 5px;
      font-size: 12px;
      padding: 5px;
      border-radius:8px;
      background: transparent;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.2s;
      margin: 0 3px 3px auto;
    }
    
    .info-item { display:flex; gap:4px;}
    .clickable { cursor:pointer; text-decoration:underline; color:#0066cc;}
    .clickable:hover { color:#003366; }
    .datePickerPopup {
      display: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
      z-index: 2;
      width: 200px;
      background: {{priorityColor}};
      backdrop-filter: blur(4px);
      font-size: 12px;
    }
    
    .sticky-container:hover .toolbar {
      visibility: visible;
      background: {{priorityColor}};
      opacity: 1;
    }
    
    /* 折叠状态：隐藏所有非头像内容 */
    .sticky-container.folded-mode .task-text,
    .sticky-container.folded-mode .datePickerPopup,
    .sticky-container.folded-mode .toolbar {
      display: none !important;
    }
    .sticky-container.folded-mode .content-area {
      justify-content: center;
      align-items: center;
    }
    .sticky-container.folded-mode .avatar-area {
      margin: 0;
    }
    .sticky-container.folded-mode .status-icon {
      display: flex !important;
    }
    
    /* 头像闪烁动画 */
    @keyframes avatarBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.1); }
    }
    
    .avatar-blink {
      animation: avatarBlink 1s ease-in-out infinite;
    }
    
    /* 提醒信息样式 */
    .reminder-info {
      font-size: 11px;
      color: #FF9800;
      background: rgba(255, 152, 0, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .reminder-info.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="sticky-container">
    <div class="content-area">
      <div class="avatar-area">{{avatarImg}}<div class="status-icon">{{statusIcon}}</div></div>
      <div class="task-text" id="taskText">{{content}}</div>
    </div>
    <div class="toolbar">
      <div class="info-item"><span>👤:</span><span id="contactName">{{senderName}}</span></div>
      <div class="info-item"><span>📅:</span><span id="dueDate" class="clickable" data-due-date="{{dueDate}}">{{dueDateText}}</span></div>
      <div class="info-item"><span>📌状态:</span><span id="taskStatus" class="clickable">{{statusText}}</span></div>
      <div class="info-item reminder-info hidden" id="reminderInfo"></div>
    </div>
    <div class="datePickerPopup" id="datePickerPopup">
      <div style="margin-bottom: 10px;">选择截止日期</div>
      <input type="date" id="popupDatePicker" style="width: 100%; padding: 6px; margin-bottom: 10px;border-radius:5px;" />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="popupConfirmBtn">确认</button>
        <button id="popupCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <script>
    window.noteId = {{noteId}};
    window.taskId = "{{taskId}}";
  </script>
  <script src="stickyScript.js"></script>
</body>
</html>
