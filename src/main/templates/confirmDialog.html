<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    .overlay {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .dialog {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      width: 360px;
      padding: 24px;
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      cursor: move;
      -webkit-app-region: drag;
    }
    .icon {
      font-size: 24px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
    }
    .body {
      margin-bottom: 24px;
    }
    .message {
      font-size: 14px;
      color: #1a1a2e;
      line-height: 1.6;
      margin: 0 0 6px 0;
      white-space: pre-line;
    }
    .detail {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      margin: 0;
    }
    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      outline: none;
    }
    .btn-cancel {
      background: #f5f5f5;
      color: #333;
      border-color: #e0e0e0;
    }
    .btn-cancel:hover {
      background: #e8e8e8;
    }
    .btn-confirm {
      background: #4a90d9;
      color: white;
    }
    .btn-confirm:hover {
      background: #357abd;
    }
    .btn-confirm.danger {
      background: #e74c3c;
    }
    .btn-confirm.danger:hover {
      background: #c0392b;
    }

    /* 暗色主题 */
    @media (prefers-color-scheme: dark) {
      .dialog {
        background: #2a2a3c;
      }
      .title {
        color: #e0e0e0;
      }
      .message {
        color: #e0e0e0;
      }
      .detail {
        color: #888;
      }
      .btn-cancel {
        background: #3a3a4c;
        color: #e0e0e0;
        border-color: #4a4a5c;
      }
      .btn-cancel:hover {
        background: #4a4a5c;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="dialog" id="dialog">
      <div class="header">
        <span class="icon" id="icon">⚠️</span>
        <h3 class="title" id="title">确认</h3>
      </div>
      <div class="body">
        <p class="message" id="message"></p>
        <p class="detail" id="detail"></p>
      </div>
      <div class="footer">
        <button class="btn btn-cancel" id="cancelBtn" onclick="handleCancel()">取消</button>
        <button class="btn btn-confirm" id="confirmBtn" onclick="handleConfirm()">确认</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const iconMap = {
      warning: '⚠️',
      danger: '💣',
      info: 'ℹ️',
      success: '✅'
    };

    ipcRenderer.on('dialog-data', (event, data) => {
      document.getElementById('title').textContent = data.title || '确认';
      document.getElementById('message').textContent = data.message || '';
      document.getElementById('detail').textContent = data.detail || '';
      document.getElementById('icon').textContent = iconMap[data.type] || iconMap.warning;
      document.getElementById('confirmBtn').textContent = data.confirmText || '确认';
      document.getElementById('cancelBtn').textContent = data.cancelText || '取消';

      if (data.type === 'danger') {
        document.getElementById('confirmBtn').classList.add('danger');
      } else {
        document.getElementById('confirmBtn').classList.remove('danger');
      }
    });

    function handleConfirm() {
      ipcRenderer.send('confirm-dialog-result', true);
    }

    function handleCancel() {
      ipcRenderer.send('confirm-dialog-result', false);
    }

    // 点击遮罩关闭
    document.getElementById('overlay').addEventListener('click', (e) => {
      if (e.target.id === 'overlay') {
        handleCancel();
      }
    });

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        handleCancel();
      }
    });
  </script>
</body>
</html>
